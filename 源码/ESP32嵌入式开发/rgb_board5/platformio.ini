; ============================================================
;  5 号板：RGB 灯 WS2812B
;  协议：《MQTT 通信协议规范_第1组》V2.0
;
;  本板按协议表 7 还挂有 adc（电位器）与 buzzer（蜂鸣器），
;  本次【不实现】，使能宏保留并设为 0。详见 readme「注意事项 C」。
;
;  直接点 VS Code 状态栏的 Upload（→）按钮烧录。
;  串口监视器波特率 115200。
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^6.21.4
    ; MQTT 库。注意不是 PubSubClient —— 协议 §8.2 要求 QoS 1，
    ; 而 PubSubClient 的 publish() 只能发 QoS 0，做不到。
    ; 详见 readme.txt「给合代码的人：必读注意事项」A 节。
    256dpi/MQTT@^2.5.2
    adafruit/Adafruit NeoPixel@^1.15.1
