; ==========================================================
;  7 号板 · 智能语音播报（tts）
;  文件：platformio.ini
;
;  PlatformIO 工程配置。用 VS Code 打开【本模块目录】后，
;  点状态栏的 Upload 即可编译烧录；串口监视器波特率 115200。
; ==========================================================

; ============================================================
;  7 号板：智能语音播报模块 tts
;  协议：《MQTT 通信协议规范_第1组》V2.0
;
;  直接点 VS Code 状态栏的 Upload（→）按钮烧录。
;  串口监视器波特率 115200。
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bblanchon/ArduinoJson@^6.21.4
    ; MQTT 库。注意不是 PubSubClient —— 协议 §8.2 要求 QoS 1，
    ; 而 PubSubClient 的 publish() 只能发 QoS 0，做不到。
    256dpi/MQTT@^2.5.2
    ; 语音模块只认 GB2312，报文是 UTF-8，转换靠这个库。
    tikaflow/UTF8ToGB2312@^1.1.52
