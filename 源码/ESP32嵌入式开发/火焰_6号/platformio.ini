; ============================================================
;  6 号板：火焰传感器模块 flame
;  协议：《MQTT 通信协议规范_第1组》V2.0
;
;  直接点 VS Code 状态栏的 Upload（→）按钮烧录。
;  串口监视器波特率 115200。
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^6.21.4
    ; MQTT 库。注意不是 PubSubClient —— 协议 §8.2 要求 evt 与 ack
    ; 用 QoS 1，而 PubSubClient 的 publish() 只能发 QoS 0，做不到。
    256dpi/MQTT@^2.5.2
