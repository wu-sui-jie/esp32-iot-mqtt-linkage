; ==========================================================
;  8 号板 · 光照度传感器（light_sensor）
;  文件：platformio.ini
;
;  PlatformIO 工程配置。用 VS Code 打开【本模块目录】后，
;  点状态栏的 Upload 即可编译烧录；串口监视器波特率 115200。
; ==========================================================

; PlatformIO 工程配置

[platformio]
src_dir = esp32_light_ir

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^6.21.4
	; MQTT 库。注意不是 PubSubClient —— 协议 §8.2 要求 ack 与事件
	; 用 QoS 1，而 PubSubClient 的 publish() 只能发 QoS 0，做不到。
	256dpi/MQTT@^2.5.2
monitor_speed = 115200
upload_speed = 921600

; 【换电脑必看】下面这行原本写的是 upload_port = COM5，
; 那是李豪自己电脑上的串口，写死以后换台电脑就会报
;     Could not open COM5 ... FileNotFoundError(2, 系统找不到指定的文件)
; 所以先注掉，让 PlatformIO 自动识别当前插着的板子。
; 只在自动识别挑错板子时才需要手动指定，改成你自己电脑上的串口即可
; （VS Code 状态栏的插头图标，或命令行 pio device list 都能看端口号）。
; upload_port = COM5
