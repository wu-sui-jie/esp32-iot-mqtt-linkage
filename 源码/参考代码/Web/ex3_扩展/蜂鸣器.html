<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜂鸣器控制页面</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }

        .buzzer-display {
            width: 200px;
            height: 200px;
            border: 8px solid #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 30px;
            position: relative;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            transition: all 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .buzzer-display.active {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            animation: pulse 1s ease-in-out infinite;
        }

        .buzzer-display.inactive {
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 40px rgba(255, 107, 107, 0.8);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            }
        }

        .buzzer-icon {
            font-size: 80px;
            color: #666;
            transition: all 0.3s ease;
        }

        .buzzer-display.active .buzzer-icon {
            color: #fff;
            animation: bounce 0.6s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .sound-waves {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 107, 107, 0.3);
            animation: ripple 2s ease-out infinite;
        }

        .buzzer-display.active .sound-waves {
            display: block;
        }

        .buzzer-display.inactive .sound-waves {
            display: none;
        }

        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        .control-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 20px 30px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-on {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
        }

        .btn-off {
            background: linear-gradient(45deg, #636e72, #2d3436);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-weight: 500;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .mqtt-config {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .mqtt-config input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .connect-btn {
            background: linear-gradient(45deg, #28a745, #20c997);
            margin-top: 10px;
        }

        .connect-btn:hover {
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        .current-state {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-weight: 600;
            font-size: 18px;
        }

        .state-on {
            color: #ff6b6b;
        }

        .state-off {
            color: #666;
        }

        .volume-indicator {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .volume-bar {
            width: 20px;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .volume-bar.active {
            background: #ff6b6b;
            height: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>蜂鸣器控制面板</h1>
        
        <div class="buzzer-display inactive" id="buzzerDisplay">
            <div class="sound-waves"></div>
            <div class="buzzer-icon">🔊</div>
        </div>

        <div class="current-state">
            <span class="state-off" id="currentState">当前状态：关闭</span>
        </div>

        <div class="volume-indicator" id="volumeIndicator" style="display: none;">
            <div class="volume-bar"></div>
            <div class="volume-bar"></div>
            <div class="volume-bar"></div>
            <div class="volume-bar"></div>
            <div class="volume-bar"></div>
        </div>

        <div class="control-buttons">
            <button class="btn btn-on" onclick="controlBuzzer(1)">打开蜂鸣器</button>
            <button class="btn btn-off" onclick="controlBuzzer(0)">关闭蜂鸣器</button>
        </div>

        <div class="status disconnected" id="status">
            未连接到 MQTT 服务器
        </div>
        
	    <br />
	    <h4>设计者: 苏州城市学院 石正璞</h4>
    </div>

    <script>
        let mqttClient = null;

        const TOPIC = "202503_PP2/01";
        
        function connectMQTT() {
            const host = "yunyismart.tech";
            const port = 9001;

            if (mqttClient) {
                mqttClient.end();
            }

            const connectUrl = `ws://${host}:${port}`;
            
            mqttClient = mqtt.connect(connectUrl, {
                clientId: 'buzzer_control_' + Math.random().toString(16).substr(2, 8),
                clean: true,
                reconnectPeriod: 1000,
                connectTimeout: 30 * 1000,
            });

            mqttClient.on('connect', function () {
                console.log('MQTT 连接成功');
                updateStatus('已连接到 MQTT 服务器', 'connected');
            });

            mqttClient.on('error', function (err) {
                console.error('MQTT 连接错误:', err);
                updateStatus('MQTT 连接失败: ' + err.message, 'disconnected');
            });

            mqttClient.on('offline', function () {
                console.log('MQTT 离线');
                updateStatus('MQTT 连接断开', 'disconnected');
            });

            mqttClient.on('reconnect', function () {
                console.log('MQTT 重连中...');
                updateStatus('MQTT 重连中...', 'disconnected');
            });
        }

        function updateStatus(message, type) {
            const statusElement = document.getElementById('status');
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
        }

        function controlBuzzer(cmd) {
            if (!mqttClient || !mqttClient.connected) {
                alert('请先连接 MQTT 服务器');
                return;
            }

            const message = {
                from: "1",
                msgType: 2,
                sensorType: "99",
                sensorId: 254,
                cmd: cmd.toString()
            };

            mqttClient.publish(TOPIC, JSON.stringify(message), function (err) {
                if (err) {
                    console.error('发送消息失败:', err);
                    alert('发送消息失败: ' + err.message);
                } else {
                    console.log('发送消息成功:', message);
                    updateBuzzerDisplay(cmd);
                }
            });
        }

        function updateBuzzerDisplay(cmd) {
            const buzzerDisplay = document.getElementById('buzzerDisplay');
            const currentStateElement = document.getElementById('currentState');
            const volumeIndicator = document.getElementById('volumeIndicator');

            // 移除所有状态类
            buzzerDisplay.className = 'buzzer-display';
            currentStateElement.className = '';

            if (cmd === 1) {
                // 打开蜂鸣器
                buzzerDisplay.classList.add('active');
                currentStateElement.classList.add('state-on');
                currentStateElement.textContent = '当前状态：开启';
                volumeIndicator.style.display = 'flex';
                updateStatus('蜂鸣器已开启', 'connected');
            } else {
                // 关闭蜂鸣器
                buzzerDisplay.classList.add('inactive');
                currentStateElement.classList.add('state-off');
                currentStateElement.textContent = '当前状态：关闭';
                volumeIndicator.style.display = 'none';
                updateStatus('蜂鸣器已关闭', 'connected');
            }
        }

        // 页面加载完成后的初始化
        window.onload = function() {
            // 可以在这里添加自动连接逻辑
            connectMQTT();
        };
    </script>
</body>
</html>
