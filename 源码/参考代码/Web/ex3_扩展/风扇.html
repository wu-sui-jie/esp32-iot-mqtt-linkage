<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>风扇控制页面</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }

        .fan-display {
            width: 200px;
            height: 200px;
            border: 8px solid #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 30px;
            position: relative;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            transition: all 0.5s ease;
        }

        .fan-blades {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 160px;
            transform: translate(-50%, -50%);
            transition: transform 0.5s ease;
        }

        .fan-blade {
            position: absolute;
            width: 60px;
            height: 20px;
            background: linear-gradient(45deg, #74b9ff, #0984e3);
            border-radius: 10px;
            transform-origin: 80px 10px;
            top: 50%;
            left: 50%;
            margin-top: -10px;
            margin-left: -80px;
        }

        .fan-blade:nth-child(1) { transform: rotate(0deg); }
        .fan-blade:nth-child(2) { transform: rotate(120deg); }
        .fan-blade:nth-child(3) { transform: rotate(240deg); }

        .fan-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            background: #333;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .fan-display.running .fan-blades {
            animation: spin 1s linear infinite;
        }

        .fan-display.running {
            box-shadow: 0 0 20px rgba(116, 185, 255, 0.5);
        }

        @keyframes spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .control-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-fan-on {
            background: linear-gradient(45deg, #00b894, #00cec9);
        }

        .btn-fan-off {
            background: linear-gradient(45deg, #e17055, #d63031);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .status {
            padding: 15px;
            border-radius: 2px;
            margin-top: 20px;
            font-weight: 500;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .msg input {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>风扇控制页面</h1>
        
        <div class="fan-display" id="fanDisplay">
            <div class="fan-center"></div>
            <div class="fan-blades">
                <div class="fan-blade"></div>
                <div class="fan-blade"></div>
                <div class="fan-blade"></div>
            </div>
        </div>

        <div class="control-buttons">
            <button class="btn btn-fan-on" onclick="controlFAN(1)">打开风扇</button>
            <button class="btn btn-fan-off" onclick="controlFAN(0)">关闭风扇</button>
        </div>

        <div class="msg">
            <label style="display: block; text-align: left; margin-bottom: 5px; color: #666;">接收/发送的消息：</label>
            <input type="text" id="msg" placeholder="订阅的消息" readonly>
        </div>

        <div class="status disconnected" id="status">
            未连接到 MQTT 服务器
        </div>
        <br />
        <h4>设计者: 苏州城市学院 石正璞</h4>
    </div>

    <script>
        let mqttClient = null;
        const HOST = "yunyismart.tech";
        const PORT = 9001;
        const TOPIC = "202603_PP2/15";

        function connectMQTT() {

            if (mqttClient) {
                mqttClient.end();
            }

            const connectUrl = `ws://${HOST}:${PORT}`;
            
            mqttClient = mqtt.connect(connectUrl, {
                clientId: 'abcdef' + Math.random().toString(16).substr(2, 8),
                clean: true,
                reconnectPeriod: 1000,
                connectTimeout: 30 * 1000,
            });

            mqttClient.on('connect', function () {
                console.log('MQTT 连接成功');
                updateStatus('已连接到 MQTT 服务器', 'connected');

                // 订阅MQTT主题
                mqttClient.subscribe(TOPIC);                
            });


            // 监听收到的MQTT消息
            mqttClient.on('message', function (topic, payload) {
                console.log('收到MQTT消息：', topic, payload.toString());
                // 将收到的消息填充到id=msg的输入框中
                const msgInput = document.getElementById('msg');
                // 格式化消息（JSON格式化，更易读）
                try {
                    // 如果是JSON格式，格式化显示
                    const jsonMsg = JSON.parse(payload.toString());
                    msgInput.value = JSON.stringify(jsonMsg, null, 2);
                } catch (e) {
                    // 非JSON格式，直接显示
                    msgInput.value = payload.toString();
                }
            });

            mqttClient.on('error', function (err) {
                console.error('MQTT 连接错误:', err);
                updateStatus('MQTT 连接失败: ' + err.message, 'disconnected');
            });

            mqttClient.on('offline', function () {
                console.log('MQTT 离线');
                updateStatus('MQTT 连接断开', 'disconnected');
            });

            mqttClient.on('reconnect', function () {
                console.log('MQTT 重连中...');
                updateStatus('MQTT 重连中...', 'disconnected');
            });
        }

        function updateStatus(message, type) {
            const statusElement = document.getElementById('status');
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
        }

        function controlFAN(cmd) {
            if (!mqttClient || !mqttClient.connected) {
                alert('请先连接 MQTT 服务器');
                return;
            }

            const message = {
                id: 0,
                device: "fan",
                key: "control",
                value: cmd ? "on" : "off"
            };

            mqttClient.publish(TOPIC, JSON.stringify(message), function (err) {
                if (err) {
                    console.error('发送消息失败:', err);
                    alert('发送消息失败: ' + err.message);
                } else {
                    console.log('发送消息成功:', message);
                    updateFanDisplay(cmd);
                }
            });
        }

        function updateFanDisplay(cmd) {
            const fanDisplay = document.getElementById('fanDisplay');

            switch(cmd) {
                case 0: // 关闭
                    fanDisplay.classList.remove('running');
                    updateStatus('风扇已关闭', 'connected');
                    break;
                case 1: // 打开
                    fanDisplay.classList.add('running');
                    updateStatus('风扇已打开', 'connected');
                    break;
            }
        }

        // 页面加载完成后的初始化
        window.onload = function() {
            // 自动连接
            connectMQTT();
        };
    </script>
</body>
</html>
