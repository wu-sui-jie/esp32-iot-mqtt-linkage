<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>LED控制页面(美化)</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* LED容器 */
        .led-box {
            display: inline-block;
            border-radius: 10px;
            background-color: #e0dcdc;
            margin: 10px;
            padding: 10px;
            border: 2px solid #ccc;
            width: 150px;
        }

        /* LED默认状态 - 就是一个圆 */
        .led {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            /* 变成圆形 */
            background-color: #333;
            /* 默认灰色（熄灭） */
            margin: 10px auto;
            border: 3px solid #555;
            /* 边框：粗细，样式，颜色 */
        }

        /* LED开启状态 - 变红色 */
        .led.on {
            background-color: red;
            box-shadow: 0 0 20px red;
            /* 简单的发光效果 */
        }

        /* 按钮样式 */
        .btn {
            padding: 10px 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 45%;
        }

        .btn-on {
            background: linear-gradient(45deg, #00b894, #00cec9);
        }

        .btn-off {
            background: linear-gradient(45deg, #e17055, #d63031);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>LED控制面板</h1>

        <!-- 所有的LED1 -->
        <div class="led-box">
            <h3>所有的LED1</h3>
            <div class="led" id="led1"></div>
            <button class="btn btn-on" onclick="control_LED1(0, 1)">开</button>
            <button class="btn btn-off" onclick="control_LED1(0, 0)">关</button>
        </div>

        <!-- 设备10的LED1 -->
        <div class="led-box">
            <h3>设备10的LED1</h3>
            <div class="led" id="led1-10"></div>
            <button class="btn btn-on" onclick="control_LED1(10, 1)">开</button>
            <button class="btn btn-off" onclick="control_LED1(10, 0)">关</button>
        </div>

        <!-- 设备11的LED1 -->
        <div class="led-box">
            <h3>设备11的LED1</h3>
            <div class="led" id="led1-11"></div>
            <button class="btn btn-on" onclick="control_LED1(11, 1)">开</button>
            <button class="btn btn-off" onclick="control_LED1(11, 0)">关</button>
        </div>

        <!-- 状态 -->
        <div style="margin-top: 30px">
            <p>消息: <input type="text" id="msg" size="40" readonly></p>
            <p id="status" style="color: red;">未连接</p>
        </div>
        
	    <br />
	    <h4>设计者: 苏州城市学院 石正璞</h4>
    </div>

    <script>
        let mqttClient = null;
        const HOST = "yunyismart.tech";
        const PORT = 9001;
        const TOPIC = "202603_PP2/15";

        // 连接MQTT
        function connectMQTT() {
            // 连接MQTT服务器
            const connectUrl = `ws://${HOST}:${PORT}`;
            mqttClient = mqtt.connect(connectUrl, {
                clientId: 'web_' + Math.random().toString(16).substr(2, 8),
                clean: true,
                reconnectPeriod: 1000
            });

            // 连接成功后
            mqttClient.on('connect', function () {
                document.getElementById('status').innerHTML = '已连接';
                document.getElementById('status').style.color = 'green';
                // 订阅主题
                mqttClient.subscribe(TOPIC);
            });

            // 收到消息处理
            mqttClient.on('message', function (topic, payload) {
                const msg = payload.toString();
                // 改变HTML页面中元素的值，此处是文本框的内容
                document.getElementById('msg').value = msg;

                // 解析JSON控制LED
                try {
                    const data = JSON.parse(msg);
                    if (data.device == "led1" && data.key == "control") {
                        update_LED1(data.id, data.value == "on" ? 1 : 0);
                    }
                } catch (e) { }
            });
        }

        // 控制LED函数 (id:0是全部，其余是某个设备id，cmd: 1开 0关)
        function control_LED1(id, cmd) {
            if (!mqttClient || !mqttClient.connected) {
                alert('未连接服务器');
                return;
            }

            // 构造消息
            const message = {
                id: id,
                device: "led1",
                key: "control",
                value: cmd == 1 ? "on" : "off"
            };

            // 发布MQTT消息
            mqttClient.publish(TOPIC, JSON.stringify(message));

            // 更新LED的界面显示，此处是否要添加？
            //update_LED1(id, cmd);
        }

        // 更新LED的界面显示 (核心：添加/删除class)
        function update_LED1(id, cmd) {
            const ledElement = (id == 0) ?
                document.getElementById('led1') :
                document.getElementById('led1-' + id);

            if (cmd == 1) {
                ledElement.classList.add('on');  // 开灯：添加on类
            } else {
                ledElement.classList.remove('on'); // 关灯：移除on类
            }
        }


        // 页面加载完成后的初始化
        window.onload = function () {
            // 自动连接
            connectMQTT();
        };
    </script>

</body>

</html>
