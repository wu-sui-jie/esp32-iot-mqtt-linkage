<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>LED控制页面(美化)</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* LED容器 */
        .led-box {
            display: inline-block;
            border-radius: 10px;
            background-color: #e0dcdc;
            margin: 10px;
            padding: 10px;
            border: 2px solid #ccc;
            width: 150px;
            vertical-align: top;
        }

        /* LED默认状态 - 就是一个圆 */
        .led {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #333;
            margin: 10px auto;
            border: 3px solid #555;
        }

        /* LED开启状态 - 变红色 */
        .led.on {
            background-color: red;
            box-shadow: 0 0 20px red;
        }

        /* 按键状态显示样式 */
        .key-status {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            margin: 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            border: 3px solid #555;
            background-color: #95a5a6; /* 默认灰色：未按下 */
            color: white;
            transition: all 0.3s ease;
        }

        /* 按键按下状态 - 变绿色 */
        .key-status.pressed {
            background-color: #27ae60;
            box-shadow: 0 0 20px #27ae60;
            transform: scale(0.95);
        }

        /* 按键状态文字 */
        .key-text {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }

        /* 按钮样式 */
        .btn {
            padding: 10px 10px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 45%;
        }

        .btn-on {
            background: linear-gradient(45deg, #00b894, #00cec9);
        }

        .btn-off {
            background: linear-gradient(45deg, #e17055, #d63031);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>LED控制面板</h1>

        <!-- 设备10的LED1 -->
        <div class="led-box">
            <h3>设备10的LED1</h3>
            <div class="led" id="led1-10"></div>
            <button class="btn btn-on" onclick="control_LED1(10, 1)">开</button>
            <button class="btn btn-off" onclick="control_LED1(10, 0)">关</button>
        </div>

        <!-- 设备10的KEY1 -->
        <div class="led-box">
            <h3>设备10的KEY1</h3>
            <div class="key-status" id="key1-10">松开</div>
            <div class="key-text">按键状态</div>
        </div>

        <!-- 状态 -->
        <div style="margin-top: 30px">
            <p>消息: <input type="text" id="msg" size="40" readonly></p>
            <p id="status" style="color: red;">未连接</p>
        </div>
    </div>

    <script>
        let mqttClient = null;
        const HOST = "yunyismart.tech";
        const PORT = 9001;
        const TOPIC = "202603_PP2/15";

        // 连接MQTT
        function connectMQTT() {
            const connectUrl = `ws://${HOST}:${PORT}`;
            mqttClient = mqtt.connect(connectUrl, {
                clientId: 'web_' + Math.random().toString(16).substr(2, 8),
                clean: true,
                reconnectPeriod: 1000
            });

            mqttClient.on('connect', function () {
                document.getElementById('status').innerHTML = '已连接';
                document.getElementById('status').style.color = 'green';
                mqttClient.subscribe(TOPIC);
            });

            // 收到消息处理
            mqttClient.on('message', function (topic, payload) {
                const msg = payload.toString();
                document.getElementById('msg').value = msg;

                try {
                    const data = JSON.parse(msg);
                    
                    // 处理LED1消息
                    if (data.device == "led1" && data.key == "control") {
                        update_LED1(data.id, data.value == "on" ? 1 : 0);
                    }
                    
                    // 处理KEY1消息（设备10的按键状态）
                    if (data.device == "key1" && data.id == 10) {
                        update_KEY1(data.value);
                    }
                    
                } catch (e) { }
            });
        }

        // 控制LED函数
        function control_LED1(id, cmd) {
            if (!mqttClient || !mqttClient.connected) {
                alert('未连接服务器');
                return;
            }

            const message = {
                id: id,
                device: "led1",
                key: "control",
                value: cmd == 1 ? "on" : "off"
            };

            mqttClient.publish(TOPIC, JSON.stringify(message));
        }

        // 更新LED显示
        function update_LED1(id, cmd) {
            const ledElement = (id == 0) ?
                document.getElementById('led1') :
                document.getElementById('led1-' + id);

            if (cmd == 1) {
                ledElement.classList.add('on');
            } else {
                ledElement.classList.remove('on');
            }
        }

        // 更新KEY1显示（核心函数）
        function update_KEY1(value) {
            const keyElement = document.getElementById('key1-10');
            
            // 支持多种消息格式： "pressed"/"released" 或 "on"/"off" 或 1/0
            const isPressed = (value == "pressed" || value == "on" || value == 1 || value == "1");
            
            if (isPressed) {
                keyElement.classList.add('pressed');
                keyElement.innerText = "按下";
            } else {
                keyElement.classList.remove('pressed');
                keyElement.innerText = "松开";
            }
        }

        window.onload = function () {
            connectMQTT();
        };
    </script>
</body>
</html>
